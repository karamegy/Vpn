name: Build Android Native APK & AAB (Apex Shield)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      - name: 1. Setup Web Assets & Local Config
        run: |
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.Vpn",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 2. Prepare Android Structure & Inject WireGuard Safely
        run: |
          # 1. التأكد من وجود ملفات بناء أندرويد الأساسية مع الحفاظ الكامل على أكواد الـ VPN
          if [ ! -f "android/gradlew" ]; then
            mkdir -p /tmp/custom_src
            if [ -d "android/app/src/main" ]; then
              cp -r android/app/src/main/* /tmp/custom_src/
            fi
            
            rm -rf android
            npx cap add android
            
            if [ -d "/tmp/custom_src" ]; then
              mkdir -p android/app/src/main
              cp -r /tmp/custom_src/* android/app/src/main/
            fi
          fi

          # 2. حقن مكتبة WireGuard وتحديث الإصدار إلى 28 عبر Node.js بدون أخطاء
          node -e '
            const fs = require("fs");
            
            const bgPath = "android/app/build.gradle";
            if (fs.existsSync(bgPath)) {
              let content = fs.readFileSync(bgPath, "utf8");
              
              if (!content.includes("com.wireguard.android:tunnel")) {
                content = content.replace(/dependencies\s*\{/, "dependencies {\n    implementation \"com.wireguard.android:tunnel:1.0.20230707\"");
              }
              
              content = content.replace(/versionCode\s+\d+/, "versionCode 28");
              content = content.replace(/versionName\s+"[^"]+"/, "versionName \"8.0.0.4\"");
              content = content.replace(/minSdkVersion\s+\d+/g, "minSdkVersion 24");
              content = content.replace(/minSdk\s+\d+/g, "minSdk 24");
              content = content.replace(/minifyEnabled\s+true/g, "minifyEnabled false");
              
              fs.writeFileSync(bgPath, content);
            }

            const vgPath = "android/variables.gradle";
            if (fs.existsSync(vgPath)) {
              let content = fs.readFileSync(vgPath, "utf8");
              content = content.replace(/compileSdkVersion\s*=\s*\d+/, "compileSdkVersion = 34");
              content = content.replace(/targetSdkVersion\s*=\s*\d+/, "targetSdkVersion = 34");
              content = content.replace(/minSdkVersion\s*=\s*\d+/, "minSdkVersion = 24");
              fs.writeFileSync(vgPath, content);
            }
          '

          # 3. مزامنة ملفات الويب فقط مع المشروع القائم
          npx cap sync android

      - name: 3. Build & Sign APK & AAB Packages
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          
          printf "%s" "$RELEASE_KEY" | base64 --decode > signing.keystore
          
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          
          ./gradlew clean assembleRelease bundleRelease --no-daemon

          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$APK_FILE" "$KEY_ALIAS"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_FILE" "$KEY_ALIAS"
          
          rm -f signing.keystore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
