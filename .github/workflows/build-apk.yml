name: Build Android Native APK & AAB (Apex Shield)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Setup Web Assets & Capacitor
        run: |
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.Vpn",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

          npx cap add android

      - name: 2. Configure Gradle & WireGuard Dependencies
        run: |
          if [ -f "android/settings.gradle" ]; then
            echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } } }" >> android/settings.gradle
          fi

          if [ -f "android/app/build.gradle" ]; then
            echo 'dependencies { implementation "com.wireguard.android:tunnel:1.0.20230707" }' >> android/app/build.gradle
          fi

          npx cap sync android

      - name: 3. Build & Sign Release Packages
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          printf "%s" "$RELEASE_KEY" | base64 --decode > signing.keystore
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          
          ./gradlew clean assembleRelease bundleRelease --no-daemon

          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$APK_FILE" "$KEY_ALIAS"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_FILE" "$KEY_ALIAS"
          rm -f signing.keystore

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-Releases
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
