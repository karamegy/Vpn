name: Build Android Native APK (Apex Shield)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verify Android Project Structure
        run: |
          echo "=== فحص هيكلة مجلد أندرويد وملفات الجافا والمانفيست ==="
          ls -la android/app/src/main/ || true
          ls -la android/app/src/main/java/com/apex/shield/ || true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Native Android APK
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: assembleDebug --no-daemon --stacktrace
          build-root-directory: android

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-Native-VPN-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
