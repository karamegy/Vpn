name: Build Android Native APK (Apex Shield)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Native Android APK
        run: |
          echo "=== جاري بدء عملية بناء الـ APK ==="
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            cd android && ./gradlew assembleDebug --no-daemon --stacktrace
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "لم يتم العثور على gradlew، جاري البناء باستخدام Gradle النظام..."
            find . -name "build.gradle"
            gradle assembleDebug --stacktrace || (cd android && gradle assembleDebug --stacktrace)
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-Native-VPN-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            **/outputs/apk/debug/*.apk
