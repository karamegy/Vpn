name: Build Android Native APK & AAB (Apex Shield)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Extract Java Files From Any Path
        run: |
          echo "=== 1. البحث عن ملفات الجافا وحفظها بغض النظر عن تداخل المسارات ==="
          mkdir -p /tmp/java_source
          find . -name "*.java" -exec cp {} /tmp/java_source/ \;
          ls -la /tmp/java_source/
          rm -rf android

      - name: 2. Prepare Web Assets & Environment
        run: |
          echo "=== 2. تجهيز بيئة العمل وملفات الويب ==="
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 3. Generate Clean Android Project
        run: |
          echo "=== 3. إنشاء هيكل مشروع أندرويد نظيف ==="
          npx cap add android

      - name: 4. Inject Java Files & Configure Manifest
        run: |
          echo "=== 4. نقل ملفات الجافا للمسار الصحيح وتكوين الخدمة ==="
          TARGET_DIR="android/app/src/main/java/com/apex/shield"
          mkdir -p $TARGET_DIR
          cp /tmp/java_source/*.java $TARGET_DIR/
          ls -la $TARGET_DIR/

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "ApexVpnService" "$MANIFEST"; then
            sed -i '/<\/application>/i \        <service android:name="com.apex.shield.ApexVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false"><intent-filter><action android:name="android.net.VpnService"\/><\/intent-filter><\/service>' "$MANIFEST"
          fi

          npx cap sync android

      - name: 5. Build APK & AAB Packages
        run: |
          echo "=== 5. بدء عملية بناء الـ APK والـ AAB ==="
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload APK (For Direct Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/app-release.aab
