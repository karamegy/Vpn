name: Build Android Native APK & AAB (Apex Shield)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 1. Install Dependencies & Prepare Assets
        run: |
          echo "=== 1. تجهيز مجلد www والتبعيات ==="
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 2. Sync Capacitor (Without Overwriting Native Code)
        run: |
          echo "=== 2. مزامنة الأصول وتحديث منصة أندرويد ==="
          # إذا لم يكن المجلد موجوداً يتم إنشاؤه، وإذا كان موجوداً لا يتم مسحه
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 3. Build APK & AAB Packages
        run: |
          echo "=== 3. بناء وتصدير حزم APK و AAB ==="
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
