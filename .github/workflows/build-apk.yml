name: Build Android Native APK & AAB (Apex Shield)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1. Setup Web Assets & Dependencies
        run: |
          echo "=== 1. تجهيز مجلد www والتبعيات ==="
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 2. Sync Web Assets to Android
        run: |
          echo "=== 2. مزامنة ملفات الويب مع مجلد أندرويد الحقيقي ==="
          # إذا لم يكن مجلد android موجوداً بالكامل في المستودع يتم إنشاؤه فقط
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # تحديث ملفات الويب داخل الأندرويد دون مسح ملفات Java أو تغيير capacitor.config.json
          npx cap sync android

      - name: 3. Build APK & AAB Packages
        run: |
          echo "=== 3. بناء وتصدير حزم APK و AAB ==="
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
