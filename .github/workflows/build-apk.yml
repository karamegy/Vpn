name: Build Android Native APK & AAB (Apex Shield)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backup Custom Android Source Files
        run: |
          echo "=== 1. أخذ نسخة احتياطية من ملفات الجافا والـ Manifest الخاصة بك ==="
          mkdir -p ../android_backup
          if [ -d "android" ]; then
            cp -r android/* ../android_backup/ || true
            rm -rf android
          fi

      - name: Prepare Web Assets & Environment
        run: |
          echo "=== 2. تجهيز حزم نود وملفات الويب ==="
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true

          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Generate Fresh Android Project
        run: |
          echo "=== 3. إنشاء هيكل مشروع أندرويد مكتمل بملفات Gradle ==="
          npx cap init "Apex Shield" "com.apex.shield" --web-dir=www || true
          npx cap add android
          npx cap sync android

      - name: Restore Custom Java & Android Manifest Files
        run: |
          echo "=== 4. دمج ملفات الجافا والـ VPN الخاصة بك داخل المشروع ==="
          if [ -d "../android_backup/app/src/main" ]; then
            cp -r ../android_backup/app/src/main/* android/app/src/main/ || true
          fi

      - name: Build Both APK and AAB Packages
        run: |
          echo "=== 5. بناء ملفات الـ APK والـ AAB ==="
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload APK (For Direct Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/app-release.aab
