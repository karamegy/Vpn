name: Build Android Native APK & AAB (Apex Shield)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1. Clean and Setup Android Platform
        run: |
          echo "=== 1. تنظيف مجلد أندرويد القديم تماماً لمنع أي تعارض ==="
          rm -rf android
          
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.apex.shield",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 2. Generate Clean Android Project
        run: |
          echo "=== 2. إنشاء مشروع أندرويد نظيف واحترافي ==="
          npx cap add android
          npx cap sync android

      - name: 3. Build APK & AAB Packages
        run: |
          echo "=== 3. بناء ملفات APK و AAB عبر غرادلي مباشرة ==="
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
