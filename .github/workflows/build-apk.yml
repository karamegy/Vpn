name: Build Android Native APK & AAB (Apex Shield)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 1. Setup Node.js System Native & Web Assets
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nodejs npm
          node -v
          npm -v

          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.Vpn",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 2. Prepare Android & Inject WireGuard Dependencies
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          cd ..

          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "com.wireguard.android:tunnel" android/app/build.gradle; then
              sed -i '/dependencies {/a \    implementation "com.wireguard.android:tunnel:1.0.20230707"' android/app/build.gradle
            fi
            sed -i -E 's/versionCode [0-9]+/versionCode 27/' android/app/build.gradle
            sed -i -E 's/versionName "[^"]*"/versionName "8.0.0.4"/' android/app/build.gradle
            sed -i 's/minSdk [0-9]+/minSdk 24/g' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]+/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
          fi

          if [ -f "android/variables.gradle" ]; then
            sed -i -E 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/variables.gradle
            sed -i -E 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/variables.gradle
            sed -i -E 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          fi

          npx cap sync android

      - name: 3. Build & Sign APK & AAB Packages
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          
          printf "%s" "$RELEASE_KEY" | base64 --decode > signing.keystore
          
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          
          ./gradlew clean assembleRelease bundleRelease --no-daemon

          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$APK_FILE" "$KEY_ALIAS"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_FILE" "$KEY_ALIAS"
          
          rm -f signing.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
