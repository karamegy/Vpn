name: Build Android Native APK & AAB (Apex Shield)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1. Setup Web Assets & Config
        run: |
          echo "=== 1. تجهيز مجلد www وتثبيت النطاق الصحيح ==="
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.Vpn",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://karamegy.github.io/Vpn/",
              "cleartext": true,
              "allowNavigation": [
                "karamegy.github.io",
                "*.github.io"
              ]
            },
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 2. Initialize Clean Capacitor Android Platform, Target SDK 36 & Version Code 26
        run: |
          echo "=== 2. إعادة بناء بيئة أندرويد وحقن جسر وخدمة الـ VPN الأصلية ==="
          npx cap add android

          if [ -f "android/variables.gradle" ]; then
            sed -i -E 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i -E 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/versionCode [0-9]+/versionCode 26/' android/app/build.gradle
            sed -i -E 's/versionName "[^"]*"/versionName "8.0.0.1"/' android/app/build.gradle
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
            
            if grep -q "com.android.billingclient:billing" android/app/build.gradle; then
              sed -i -E 's/com\.android\.billingclient:billing:[^"]+/com.android.billingclient:billing:8.0.0/g' android/app/build.gradle
            else
              echo 'dependencies { implementation "com.android.billingclient:billing:8.0.0" }' >> android/app/build.gradle
            fi
          fi

          # إنشاء مسار الحزمة البرمجية لجسر أندرويد
          TARGET_JAVA_DIR="android/app/src/main/java/io/github/karamegy/Vpn"
          mkdir -p "$TARGET_JAVA_DIR"

          # حقن كود جسر الـ Capacitor الأصلي (AndroidVPNBridge.java)
          cat << 'EOF' > "$TARGET_JAVA_DIR/AndroidVPNBridge.java"
          package io.github.karamegy.Vpn;

          import android.content.Intent;
          import android.net.VpnService;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AndroidVPNBridge")
          public class AndroidVPNBridge extends Plugin {

              @PluginMethod
              public void toggleVpn(PluginCall call) {
                  boolean enable = call.getBoolean("enable", false);
                  String serverIp = call.getString("serverIp");
                  
                  if (enable) {
                      Intent intent = VpnService.prepare(getContext());
                      if (intent != null) {
                          startActivityForResult(call, intent, "vpnPermissionResult");
                      } else {
                          startVpnService(serverIp);
                          JSObject ret = new JSObject();
                          ret.put("success", true);
                          call.resolve(ret);
                      }
                  } else {
                      stopVpnService();
                      JSObject ret = new JSObject();
                      ret.put("success", true);
                      call.resolve(ret);
                  }
              }

              @Override
              protected void handleOnActivityResult(int requestCode, int resultCode, Intent data) {
                  super.handleOnActivityResult(requestCode, resultCode, data);
                  PluginCall savedCall = getSavedCall();
                  if (savedCall != null) {
                      if (resultCode == android.app.Activity.RESULT_OK) {
                          String serverIp = savedCall.getString("serverIp");
                          startVpnService(serverIp);
                          JSObject ret = new JSObject();
                          ret.put("success", true);
                          savedCall.resolve(ret);
                      } else {
                          JSObject ret = new JSObject();
                          ret.put("success", false);
                          savedCall.resolve(ret);
                      }
                  }
              }

              private void startVpnService(String serverIp) {
                  Intent intent = new Intent(getContext(), ApexVpnService.class);
                  intent.putExtra("serverIp", serverIp);
                  getContext().startService(intent);
              }

              private void stopVpnService() {
                  Intent intent = new Intent(getContext(), ApexVpnService.class);
                  getContext().stopService(intent);
              }
          }
          EOF

          # حقن خدمة تشغيل النفق الحقيقي (ApexVpnService.java)
          cat << 'EOF' > "$TARGET_JAVA_DIR/ApexVpnService.java"
          package io.github.karamegy.Vpn;

          import android.content.Intent;
          import android.net.VpnService;
          import android.os.ParcelFileDescriptor;
          import java.io.IOException;

          public class ApexVpnService extends VpnService {
              private ParcelFileDescriptor mInterface;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  try {
                      Builder builder = new Builder();
                      builder.addAddress("10.0.0.2", 24);
                      builder.addRoute("0.0.0.0", 0);
                      builder.addDnsServer("1.1.1.1");
                      builder.setSession("Apex Shield WARP");
                      mInterface = builder.establish();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (mInterface != null) {
                      try {
                          mInterface.close();
                      } catch (IOException e) {
                          e.printStackTrace();
                      }
                      mInterface = null;
                  }
              }
          }
          EOF

          # تحديث ملف الـ AndroidManifest.xml لإضافة صلاحيات خدمة الـ VPN وتسجيل الخدمة
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            # التأكد من وجود صلاحية BIND_VPN_SERVICE
            if ! grep -q "BIND_VPN_SERVICE" "$MANIFEST_PATH"; then
              sed -i '/<uses-permission android:name="android\.permission\.INTERNET"/a \    <uses-permission android:name="android.permission.BIND_VPN_SERVICE"/>' "$MANIFEST_PATH"
            fi
            # حقن تعريف الخدمة داخل الـ application
            if ! grep -q "ApexVpnService" "$MANIFEST_PATH"; then
              sed -i '/<\/application>/i \    <service android:name=".ApexVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="true">\n        <intent-filter>\n            <action android:name="android.net.VpnService"/>\n        </intent-filter>\n    </service>' "$MANIFEST_PATH"
            fi
          fi

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Apex Shield</string>
              <string name="appName">Apex Shield</string>
              <string name="launcherName">Apex Shield</string>
              <string name="hostName">karamegy.github.io</string>
              <string name="title_activity_main">Apex Shield</string>
              <string name="package_name">io.github.karamegy.Vpn</string>
              <string name="custom_url_scheme">io.github.karamegy.Vpn</string>
          </resources>
          EOF

          npx cap sync android

      - name: 3. Build & Sign APK & AAB Packages
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== 3. فك تشفير المفتاح الأصلي وبناء وتوقيع الحزمة ==="
          cd android
          
          printf "%s" "$RELEASE_KEY" | base64 --decode > signing.keystore
          
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          ./gradlew assembleDebug bundleRelease --no-daemon

          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          echo "=== توقيع الملف بمفتاح Release الأصلي ==="
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_FILE" "$KEY_ALIAS"
          
          rm -f signing.keystore
          echo "تم توقيع ملف AAB بنجاح بالمفتاح الأصلي المطابق لبصمة متجر جوجل بلاي!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
