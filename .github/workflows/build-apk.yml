name: Build Android Native APK & AAB (Apex Shield)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1. Setup Web Assets & Config
        run: |
          echo "=== 1. تجهيز مجلد www وتثبيت النطاق الصحيح ==="
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.Vpn",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://karamegy.github.io/Vpn/",
              "cleartext": true,
              "allowNavigation": [
                "karamegy.github.io",
                "*.github.io"
              ]
            },
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 2. Initialize Clean Capacitor Android Platform, Target SDK 36 & Version Code 23
        run: |
          echo "=== 2. حفظ ملفات الجافا والـ Manifest وإعادة بناء بيئة أندرويد ==="
          mkdir -p /tmp/native_backup
          if [ -d "android/app/src/main/java" ]; then
            cp -r android/app/src/main/java /tmp/native_backup/
          fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/native_backup/
          fi

          rm -rf android
          npx cap add android

          if [ -f "android/variables.gradle" ]; then
            sed -i -E 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i -E 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/versionCode [0-9]+/versionCode 23/' android/app/build.gradle
            sed -i -E 's/versionName "[^"]+"/versionName "36"/' android/app/build.gradle
          fi

          TARGET_JAVA_DIR="android/app/src/main/java/io/github/karamegy/Vpn"
          mkdir -p "$TARGET_JAVA_DIR"
          if [ -d "/tmp/native_backup/java" ]; then
            find /tmp/native_backup/java -type f -name "*.java" -exec cp {} "$TARGET_JAVA_DIR/" \; 2>/dev/null || true
          fi

          if [ -f "/tmp/native_backup/AndroidManifest.xml" ]; then
            cp /tmp/native_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            sed -i 's/com\.apex\.shield/io\.github\.karamegy\.Vpn/g' android/app/src/main/AndroidManifest.xml
          fi

          find android/app/src/main/java -type f -name "*.java" -exec sed -i 's/com\.apex\.shield/io\.github\.karamegy\.Vpn/g' {} +

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Apex Shield</string>
              <string name="appName">Apex Shield</string>
              <string name="launcherName">Apex Shield</string>
              <string name="hostName">karamegy.github.io</string>
              <string name="title_activity_main">Apex Shield</string>
              <string name="package_name">io.github.karamegy.Vpn</string>
              <string name="custom_url_scheme">io.github.karamegy.Vpn</string>
          </resources>
          EOF

          npx cap sync android

      - name: 3. Build & Sign APK & AAB Packages with Real Keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          echo "=== 3. فك تشفير المفتاح الحقيقي وتوقيع حزم التطبيق به ==="
          cd android
          
          # استعادة ملف المفتاح الحقيقي من الـ Secrets وتجنب توليد مفتاح عشوائي
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > permanent-release-key.keystore
          
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          ./gradlew assembleDebug bundleRelease --no-daemon

          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore permanent-release-key.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_FILE" "$KEY_ALIAS"
          echo "تم توقيع ملف AAB بنجاح تام بالمفتاح الأصلي وثبتت البصمة!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
