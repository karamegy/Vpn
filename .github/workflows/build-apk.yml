name: Build Android Native APK & AAB (Apex Shield)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Setup Web Assets & Local Config
        run: |
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.Vpn",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 2. Initialize Capacitor Android Platform & Configurations
        run: |
          rm -rf android
          npx cap add android

          TARGET_DIR="android/app/src/main/java/io/github/karamegy/Vpn"
          mkdir -p "$TARGET_DIR"

          if [ -d "android/app/src/main/java/com/apex/shield" ]; then
            cp -r android/app/src/main/java/com/apex/shield/* "$TARGET_DIR/" 2>/dev/null || true
          fi

          find android/app/src/main/java -type f -name "*.java" -exec sed -i 's/package com\.apex\.shield;/package io.github.karamegy.Vpn;/g' {} +
          find android/app/src/main/java -type f -name "*.java" -exec sed -i 's/com\.apex\.shield/io\.github\.karamegy\.Vpn/g' {} +

          if [ -f "android/variables.gradle" ]; then
            sed -i -E 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i -E 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/versionCode [0-9]+/versionCode 24/' android/app/build.gradle
            sed -i -E 's/versionName "[^"]*"/versionName "8.0.0.3"/' android/app/build.gradle
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
          fi

          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "BIND_VPN_SERVICE" "$MANIFEST_PATH"; then
              sed -i '/<uses-permission android:name="android\.permission\.INTERNET"/a \    <uses-permission android:name="android.permission.BIND_VPN_SERVICE"/>' "$MANIFEST_PATH"
            fi
            if ! grep -q "ApexVpnService" "$MANIFEST_PATH"; then
              sed -i '/<\/application>/i \    <service android:name="io.github.karamegy.Vpn.ApexVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">\n        <intent-filter>\n            <action android:name="android.net.VpnService"/>\n        </intent-filter>\n    </service>' "$MANIFEST_PATH"
            fi
          fi

          npx cap sync android

      - name: 3. Build & Sign APK & AAB Packages
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          
          # إصلاح وتحديث ملف التوزيع برمجياً لضمان بناء نظيف بدون أخطاء تحميل
          PROP_FILE="gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROP_FILE" ]; then
            echo "distributionBase=GRADLE_USER_HOME" > "$PROP_FILE"
            echo "distributionPath=wrapper/dists" >> "$PROP_FILE"
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> "$PROP_FILE"
            echo "zipStoreBase=GRADLE_USER_HOME" >> "$PROP_FILE"
            echo "zipStorePath=wrapper/dists" >> "$PROP_FILE"
          fi

          printf "%s" "$RELEASE_KEY" | base64 --decode > signing.keystore
          
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          ./gradlew clean assembleDebug bundleRelease --no-daemon

          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_FILE" "$KEY_ALIAS"
          
          rm -f signing.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
