name: Build Android Native APK & AAB (Apex Shield)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1. Setup Web Assets & Config
        run: |
          echo "=== 1. تجهيز مجلد www وتثبيت النطاق الصحيح ==="
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.Vpn",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://karamegy.github.io/Vpn/",
              "cleartext": true,
              "allowNavigation": [
                "karamegy.github.io",
                "*.github.io"
              ]
            },
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 2. Initialize Clean Capacitor Android Platform & Fix Java Paths
        run: |
          echo "=== 2. بناء بيئة أندرويد وتصحيح مسارات الجسر الأصلي ==="
          
          # حفظ ملفات الجافا القديمة إن وجدت في مسارها الصحيح
          mkdir -p /tmp/native_backup
          if [ -d "android/app/src/main/java" ]; then
            cp -r android/app/src/main/java /tmp/native_backup/
          fi

          rm -rf android
          npx cap add android

          if [ -f "android/variables.gradle" ]; then
            sed -i -E 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i -E 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/versionCode [0-9]+/versionCode 26/' android/app/build.gradle
            sed -i -E 's/versionName "[^"]*"/versionName "8.0.0.1"/' android/app/build.gradle
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
            
            if grep -q "com.android.billingclient:billing" android/app/build.gradle; then
              sed -i -E 's/com\.android\.billingclient:billing:[^"]+/com.android.billingclient:billing:8.0.0/g' android/app/build.gradle
            else
              echo 'dependencies { implementation "com.android.billingclient:billing:8.0.0" }' >> android/app/build.gradle
            fi
          fi

          # إنشاء مسار الحزمة الصحيح والمطابق لـ appId (io/github/karamegy/Vpn)
          TARGET_JAVA_DIR="android/app/src/main/java/io/github/karamegy/Vpn"
          mkdir -p "$TARGET_JAVA_DIR"

          # نقل واستعادة ملفات الجافا وتحديث حزمتها برمجياً لتتطابق تماماً
          if [ -d "/tmp/native_backup/java" ]; then
            find /tmp/native_backup/java -type f -name "*.java" -exec cp {} "$TARGET_JAVA_DIR/" \; 2>/dev/null || true
          fi

          # تحديث محتوى ملفات الجافا لتستخدم الحزمة الصحيحة وتتعرف على كاباسيتور
          find android/app/src/main/java -type f -name "*.java" -exec sed -i 's/package com\.apex\.shield;/package io.github.karamegy.Vpn;/g' {} +
          find android/app/src/main/java -type f -name "*.java" -exec sed -i 's/com\.apex\.shield/io\.github\.karamegy\.Vpn/g' {} +

          # التأكد من وجود ملف AndroidVPNBridgePlugin.java وتحديث اسم الكلاس لو تطابق مع النداء
          if [ -f "$TARGET_JAVA_DIR/AndroidVPNBridgePlugin.java" ]; then
            sed -i 's/@CapacitorPlugin(name = "AndroidVPNBridge")/ /g' "$TARGET_JAVA_DIR/AndroidVPNBridgePlugin.java" || true
          fi

          # حقن صلاحية الخدمة وصلاحيات الـ VPN داخل ملف الـ Manifest
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "BIND_VPN_SERVICE" "$MANIFEST_PATH"; then
              sed -i '/<uses-permission android:name="android\.permission\.INTERNET"/a \    <uses-permission android:name="android.permission.BIND_VPN_SERVICE"/>' "$MANIFEST_PATH"
            fi
            if ! grep -q "ApexVpnService" "$MANIFEST_PATH"; then
              sed -i '/<\/application>/i \    <service android:name="io.github.karamegy.Vpn.ApexVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="true">\n        <intent-filter>\n            <action android:name="android.net.VpnService"/>\n        </intent-filter>\n    </service>' "$MANIFEST_PATH"
            fi
          fi

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Apex Shield</string>
              <string name="appName">Apex Shield</string>
              <string name="launcherName">Apex Shield</string>
              <string name="hostName">karamegy.github.io</string>
              <string name="title_activity_main">Apex Shield</string>
              <string name="package_name">io.github.karamegy.Vpn</string>
              <string name="custom_url_scheme">io.github.karamegy.Vpn</string>
          </resources>
          EOF

          npx cap sync android

      - name: 3. Build & Sign APK & AAB Packages
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== 3. فك تشفير المفتاح الأصلي وبناء وتوقيع الحزمة ==="
          cd android
          
          printf "%s" "$RELEASE_KEY" | base64 --decode > signing.keystore
          
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          ./gradlew assembleDebug bundleRelease --no-daemon

          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          echo "=== توقيع الملف بمفتاح Release الأصلي ==="
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_FILE" "$KEY_ALIAS"
          
          rm -f signing.keystore
          echo "تم توقيع ملف AAB بنجاح بالمفتاح الأصلي المطابق لبصمة متجر جوجل بلاي!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
