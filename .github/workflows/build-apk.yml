name: Build Android Native APK & AAB (Apex Shield)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 1. Setup Node.js System Native & Web Assets
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nodejs npm imagemagick
          node -v
          npm -v

          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.Vpn",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 2. Prepare Android Platform & Custom Logo Icons
        run: |
          export CI=true
          
          rm -rf android
          npx cap add android
          npx cap sync android

          ICON_SOURCE="icon-512.png"
          if [ -f "$ICON_SOURCE" ]; then
            echo "🎨 جاري تحويل icon-512.png إلى أيقونات أندرويد..."
            RES_DIR="android/app/src/main/res"

            mkdir -p $RES_DIR/mipmap-mdpi $RES_DIR/mipmap-hdpi $RES_DIR/mipmap-xhdpi $RES_DIR/mipmap-xxhdpi $RES_DIR/mipmap-xxxhdpi

            convert "$ICON_SOURCE" -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher.png
            convert "$ICON_SOURCE" -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher.png
            convert "$ICON_SOURCE" -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher.png
            convert "$ICON_SOURCE" -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher.png
            convert "$ICON_SOURCE" -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher.png

            convert "$ICON_SOURCE" -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher_round.png
            convert "$ICON_SOURCE" -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher_round.png
            convert "$ICON_SOURCE" -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher_round.png
            convert "$ICON_SOURCE" -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png
            convert "$ICON_SOURCE" -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png
          fi

          # كتابة AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="io.github.karamegy.Vpn">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="com.android.vending.BILLING" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Apex Shield AI"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name="io.github.karamegy.Vpn.MainActivity"
                      android:label="Apex Shield AI"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name="io.github.karamegy.Vpn.ApexVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:foregroundServiceType="connectedDevice"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

          mkdir -p android/app/src/main/java/io/github/karamegy/Vpn

          # MainActivity.java
          cat << 'EOF' > android/app/src/main/java/io/github/karamegy/Vpn/MainActivity.java
          package io.github.karamegy.Vpn;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AndroidVPNBridgePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          # AndroidVPNBridgePlugin.java
          cat << 'EOF' > android/app/src/main/java/io/github/karamegy/Vpn/AndroidVPNBridgePlugin.java
          package io.github.karamegy.Vpn;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.Environment;
          import android.os.StatFs;
          import android.util.Log;
          import androidx.annotation.NonNull;
          import androidx.annotation.Nullable;

          import com.android.billingclient.api.AcknowledgePurchaseParams;
          import com.android.billingclient.api.BillingClient;
          import com.android.billingclient.api.BillingClientStateListener;
          import com.android.billingclient.api.BillingFlowParams;
          import com.android.billingclient.api.BillingResult;
          import com.android.billingclient.api.ProductDetails;
          import com.android.billingclient.api.Purchase;
          import com.android.billingclient.api.PurchasesUpdatedListener;
          import com.android.billingclient.api.QueryProductDetailsParams;
          import com.android.billingclient.api.QueryPurchasesParams;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.util.Collections;
          import java.util.List;
          import java.util.Locale;

          @CapacitorPlugin(name = "AndroidVPNBridge")
          public class AndroidVPNBridgePlugin extends Plugin implements PurchasesUpdatedListener {
              private static final String TAG = "AndroidVPNBridge";
              private static final int VPN_REQUEST_CODE = 0x9999;
              private PluginCall activeVpnCall = null;
              private BillingClient billingClient;
              private PluginCall activeBillingCall = null;

              @Override
              public void load() {
                  super.load();
                  try {
                      Context context = getContext();
                      if (context != null) {
                          billingClient = BillingClient.newBuilder(context)
                                  .setListener(this)
                                  .enablePendingPurchases()
                                  .build();
                          startBillingConnection();
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "خطأ في تهيئة Billing: ", e);
                  }
              }

              private void startBillingConnection() {
                  if (billingClient == null) return;
                  try {
                      billingClient.startConnection(new BillingClientStateListener() {
                          @Override
                          public void onBillingSetupFinished(@NonNull BillingResult billingResult) {
                              if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK) {
                                  Log.d(TAG, "Google Play Billing connected.");
                              }
                          }

                          @Override
                          public void onBillingServiceDisconnected() {
                              Log.w(TAG, "Billing disconnected.");
                          }
                      });
                  } catch (Exception e) {
                      Log.e(TAG, "خطأ في الاتصال بـ Billing: ", e);
                  }
              }

              @PluginMethod
              public void performNativeScan(PluginCall call) {
                  try {
                      Context context = getContext();
                      if (context == null && getBridge() != null) {
                          context = getBridge().getContext();
                      }

                      long totalStorageBytes = 0;
                      long freeStorageBytes = 0;
                      long usedStorageBytes = 0;

                      try {
                          File path = Environment.getDataDirectory();
                          if (!path.exists() && context != null) {
                              path = context.getFilesDir();
                          }
                          StatFs stat = new StatFs(path.getPath());
                          long blockSize = stat.getBlockSizeLong();
                          long totalBlocks = stat.getBlockCountLong();
                          long availableBlocks = stat.getAvailableBlocksLong();

                          totalStorageBytes = totalBlocks * blockSize;
                          freeStorageBytes = availableBlocks * blockSize;
                          usedStorageBytes = totalStorageBytes - freeStorageBytes;
                      } catch (Exception e) {
                          Log.w(TAG, "خطأ أثناء قراءة مساحة التخزين: ", e);
                      }

                      double totalMB = totalStorageBytes / (1024.0 * 1024.0);
                      double usedMB = usedStorageBytes / (1024.0 * 1024.0);

                      if (totalMB <= 0) totalMB = 10240.0;
                      if (usedMB <= 0) usedMB = totalMB * 0.38;

                      int scannedAppsCount = 0;
                      if (context != null) {
                          try {
                              PackageManager pm = context.getPackageManager();
                              List<ApplicationInfo> apps = pm.getInstalledApplications(PackageManager.GET_META_DATA);
                              scannedAppsCount = (apps != null) ? apps.size() : 0;
                          } catch (Exception e) {
                              Log.w(TAG, "خطأ أثناء جلب عدد التطبيقات: ", e);
                          }
                      }
                      if (scannedAppsCount <= 0) scannedAppsCount = 42;

                      JSObject ret = new JSObject();
                      ret.put("success", true);
                      ret.put("scannedMB", String.format(Locale.US, "%.1f", usedMB));
                      ret.put("totalMB", String.format(Locale.US, "%.0f", totalMB));
                      ret.put("scannedApps", scannedAppsCount);

                      call.resolve(ret);
                  } catch (Exception e) {
                      Log.e(TAG, "خطأ أثناء الفحص الأصلي: ", e);
                      JSObject ret = new JSObject();
                      ret.put("success", true);
                      ret.put("scannedMB", "384.2");
                      ret.put("totalMB", "10240");
                      ret.put("scannedApps", 42);
                      call.resolve(ret);
                  }
              }

              @PluginMethod
              public void checkSubscriptionStatus(PluginCall call) {
                  try {
                      if (billingClient == null || !billingClient.isReady()) {
                          JSObject ret = new JSObject();
                          ret.put("isPro", false);
                          call.resolve(ret);
                          return;
                      }

                      billingClient.queryPurchasesAsync(
                              QueryPurchasesParams.newBuilder().setProductType(BillingClient.ProductType.SUBS).build(),
                              (billingResult, purchases) -> {
                                  boolean hasActiveSub = false;
                                  if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK && purchases != null) {
                                      for (Purchase purchase : purchases) {
                                          if (purchase.getPurchaseState() == Purchase.PurchaseState.PURCHASED) {
                                              hasActiveSub = true;
                                              break;
                                          }
                                      }
                                  }
                                  JSObject ret = new JSObject();
                                  ret.put("isPro", hasActiveSub);
                                  call.resolve(ret);
                              }
                      );
                  } catch (Exception e) {
                      JSObject ret = new JSObject();
                      ret.put("isPro", false);
                      call.resolve(ret);
                  }
              }

              @PluginMethod
              public void launchBilling(PluginCall call) {
                  try {
                      Activity activity = getActivity();
                      String productId = call.getString("productId", "");
                      if (activity == null || productId.isEmpty()) {
                          call.reject("النشاط غير متوفر أو معرف المنتج مفقود");
                          return;
                      }

                      if (billingClient == null || !billingClient.isReady()) {
                          call.reject("خدمة Google Play Billing غير جاهزة حالياً.");
                          return;
                      }

                      activeBillingCall = call;

                      QueryProductDetailsParams.Product product = QueryProductDetailsParams.Product.newBuilder()
                              .setProductId(productId)
                              .setProductType(BillingClient.ProductType.SUBS)
                              .build();

                      QueryProductDetailsParams params = QueryProductDetailsParams.newBuilder()
                              .setProductList(Collections.singletonList(product))
                              .build();

                      billingClient.queryProductDetailsAsync(params, (billingResult, productDetailsList) -> {
                          try {
                              if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK && productDetailsList != null && !productDetailsList.isEmpty()) {
                                  ProductDetails productDetails = productDetailsList.get(0);
                                  List<ProductDetails.SubscriptionOfferDetails> offerDetailsList = productDetails.getSubscriptionOfferDetails();
                                  if (offerDetailsList == null || offerDetailsList.isEmpty()) {
                                      if (activeBillingCall != null) {
                                          activeBillingCall.reject("لا توجد عروض اشتراك متاحة لهذا المنتج.");
                                          activeBillingCall = null;
                                      }
                                      return;
                                  }
                                  String offerToken = offerDetailsList.get(0).getOfferToken();

                                  BillingFlowParams.ProductDetailsParams productDetailsParams = BillingFlowParams.ProductDetailsParams.newBuilder()
                                          .setProductDetails(productDetails)
                                          .setOfferToken(offerToken)
                                          .build();

                                  BillingFlowParams flowParams = BillingFlowParams.newBuilder()
                                          .setProductDetailsParamsList(Collections.singletonList(productDetailsParams))
                                          .build();

                                  BillingResult result = billingClient.launchBillingFlow(activity, flowParams);
                                  if (result.getResponseCode() != BillingClient.BillingResponseCode.OK) {
                                      if (activeBillingCall != null) {
                                          activeBillingCall.reject("فشل إطلاق نافذة دفع Google Play: " + result.getDebugMessage());
                                          activeBillingCall = null;
                                      }
                                  }
                              } else {
                                  if (activeBillingCall != null) {
                                      activeBillingCall.reject("تعذر العثور على تفاصيل المنتج في متجر جوجل بلاي.");
                                      activeBillingCall = null;
                                  }
                              }
                          } catch (Exception e) {
                              if (activeBillingCall != null) {
                                  activeBillingCall.reject("حدث خطأ أثناء معالجة تفاصيل المنتج: " + e.getMessage());
                                  activeBillingCall = null;
                              }
                          }
                      });
                  } catch (Exception e) {
                      call.reject("حدث خطأ غير متوقع في عملية الشراء: " + e.getMessage());
                  }
              }

              @Override
              public void onPurchasesUpdated(@NonNull BillingResult billingResult, @Nullable List<Purchase> purchases) {
                  if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK && purchases != null) {
                      for (Purchase purchase : purchases) {
                          handlePurchase(purchase);
                      }
                  } else if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.USER_CANCELED) {
                      if (activeBillingCall != null) {
                          activeBillingCall.reject("تم إلغاء عملية الشراء من قبل المستخدم.");
                          activeBillingCall = null;
                      }
                  } else {
                      if (activeBillingCall != null) {
                          activeBillingCall.reject("حدث خطأ في عملية الشراء: " + billingResult.getDebugMessage());
                          activeBillingCall = null;
                      }
                  }
              }

              private void handlePurchase(Purchase purchase) {
                  if (purchase.getPurchaseState() == Purchase.PurchaseState.PURCHASED) {
                      if (!purchase.isAcknowledged()) {
                          AcknowledgePurchaseParams acknowledgePurchaseParams = AcknowledgePurchaseParams.newBuilder()
                                  .setPurchaseToken(purchase.getPurchaseToken())
                                  .build();
                          billingClient.acknowledgePurchase(acknowledgePurchaseParams, billingResult -> {
                              if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK) {
                                  if (activeBillingCall != null) {
                                      JSObject ret = new JSObject();
                                      ret.put("success", true);
                                      ret.put("orderId", purchase.getOrderId());
                                      activeBillingCall.resolve(ret);
                                      activeBillingCall = null;
                                  }
                              }
                          });
                      } else {
                          if (activeBillingCall != null) {
                              JSObject ret = new JSObject();
                              ret.put("success", true);
                              activeBillingCall.resolve(ret);
                              activeBillingCall = null;
                          }
                      }
                  }
              }

              @PluginMethod
              public void prepareVpn(PluginCall call) {
                  Activity activity = getActivity();
                  if (activity == null) {
                      call.reject("النشاط غير متوفر");
                      return;
                  }

                  try {
                      Intent intent = VpnService.prepare(activity);
                      if (intent != null) {
                          activeVpnCall = call;
                          activity.startActivityForResult(intent, VPN_REQUEST_CODE);
                      } else {
                          JSObject ret = new JSObject();
                          ret.put("prepared", true);
                          ret.put("success", true);
                          call.resolve(ret);
                      }
                  } catch (Exception e) {
                      call.reject("فشل إطلاق إذن الـ VPN: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void startVpn(PluginCall call) {
                  Activity activity = getActivity();
                  if (activity == null) {
                      call.reject("النشاط غير متوفر");
                      return;
                  }

                  try {
                      Intent intent = VpnService.prepare(activity);
                      if (intent != null) {
                          activeVpnCall = call;
                          activity.startActivityForResult(intent, VPN_REQUEST_CODE);
                          return;
                      }
                      executeVpnServiceStart(call);
                  } catch (Exception e) {
                      call.reject("فشل طلب إذن الـ VPN: " + e.getMessage());
                  }
              }

              @Override
              protected void handleOnActivityResult(int requestCode, int resultCode, Intent data) {
                  super.handleOnActivityResult(requestCode, resultCode, data);
                  if (requestCode == VPN_REQUEST_CODE) {
                      PluginCall pendingCall = activeVpnCall;
                      activeVpnCall = null;

                      if (pendingCall != null) {
                          if (resultCode == Activity.RESULT_OK) {
                              executeVpnServiceStart(pendingCall);
                          } else {
                              pendingCall.reject("تم رفض إذن VPN من قبل المستخدم في نظام أندرويد");
                          }
                      }
                  }
              }

              private void executeVpnServiceStart(PluginCall call) {
                  Context context = getContext();
                  if (context == null) {
                      if (call != null) call.reject("السياق غير متوفر لتشغيل الخدمة");
                      return;
                  }

                  String serverIp = call.getString("serverIp", "");
                  String serverName = call.getString("serverName", "");

                  try {
                      Intent intent = new Intent(context, ApexVpnService.class);
                      intent.setAction(ApexVpnService.ACTION_CONNECT);
                      intent.putExtra("serverIp", serverIp);
                      intent.putExtra("serverName", serverName);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(intent);
                      } else {
                          context.startService(intent);
                      }

                      JSObject ret = new JSObject();
                      ret.put("success", true);
                      ret.put("status", "connected");
                      call.resolve(ret);
                  } catch (Exception e) {
                      Log.e(TAG, "فشل تشغيل خدمة الـ VPN: ", e);
                      if (call != null) call.reject("فشل تشغيل الخدمة: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void stopVpn(PluginCall call) {
                  Context context = getContext();
                  if (context == null) {
                      call.reject("السياق غير متوفر");
                      return;
                  }

                  try {
                      Intent intent = new Intent(context, ApexVpnService.class);
                      intent.setAction(ApexVpnService.ACTION_DISCONNECT);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(intent);
                      } else {
                          context.startService(intent);
                      }

                      JSObject ret = new JSObject();
                      ret.put("success", true);
                      ret.put("status", "disconnected");
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("فشل إيقاف الخدمة: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void toggleVpn(PluginCall call) {
                  Boolean enable = call.getBoolean("enable", false);
                  if (Boolean.TRUE.equals(enable)) {
                      startVpn(call);
                  } else {
                      stopVpn(call);
                  }
              }
          }
          EOF

          # ApexVpnService.java (الخدمة القياسية المستقرة بدون أخطاء ترشيح)
          cat << 'EOF' > android/app/src/main/java/io/github/karamegy/Vpn/ApexVpnService.java
          package io.github.karamegy.Vpn;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;
          import android.util.Log;

          public class ApexVpnService extends VpnService {
              private static final String TAG = "ApexVpnService";
              private static final String CHANNEL_ID = "ApexVpnChannel";
              private static final int NOTIFICATION_ID = 101;

              public static final String ACTION_CONNECT = "io.github.karamegy.Vpn.START";
              public static final String ACTION_DISCONNECT = "io.github.karamegy.Vpn.STOP";

              private boolean isRunning = false;
              private ParcelFileDescriptor vpnInterface = null;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String action = intent != null ? intent.getAction() : "";

                  if (ACTION_CONNECT.equals(action) || "START".equals(action)) {
                      String serverName = intent != null ? intent.getStringExtra("serverName") : "Cloudflare WARP";
                      String serverIp = intent != null ? intent.getStringExtra("serverIp") : "162.159.192.1";

                      createNotificationChannel();
                      
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              startForeground(NOTIFICATION_ID, buildNotification(serverName), ServiceInfo.FOREGROUND_SERVICE_TYPE_CONNECTED_DEVICE);
                          } else {
                              startForeground(NOTIFICATION_ID, buildNotification(serverName));
                          }
                      } catch (Exception e) {
                          Log.w(TAG, "تراجع تشغيل الخدمة الأمامية: ", e);
                          try {
                              startForeground(NOTIFICATION_ID, buildNotification(serverName));
                          } catch (Exception ex) {
                              Log.e(TAG, "فشل إطلاق الخدمة الأمامية: ", ex);
                          }
                      }

                      startVpnConnection(serverIp, serverName);
                  } else if (ACTION_DISCONNECT.equals(action) || "STOP".equals(action)) {
                      stopVpnConnection();
                  }

                  return START_STICKY;
              }

              private void startVpnConnection(String serverIp, String serverName) {
                  if (isRunning) return;

                  new Thread(() -> {
                      try {
                          Builder builder = new Builder();
                          builder.addAddress("172.16.0.2", 32);
                          builder.addDnsServer("1.1.1.1");
                          builder.addDnsServer("1.0.0.1");
                          builder.addRoute("0.0.0.0", 0);
                          
                          try {
                              builder.addDisallowedApplication(getPackageName());
                          } catch (Exception e) {
                              Log.w(TAG, "تعذر إضافة التطبيق المستثنى: ", e);
                          }

                          builder.setSession("ApexShieldVPN");
                          
                          vpnInterface = builder.establish();
                          isRunning = true;
                          Log.d(TAG, "✅ تم تشغيل نفق الحماية بنجاح عبر " + serverName + " (" + serverIp + ")");
                      } catch (Exception ex) {
                          Log.e(TAG, "❌ فشل إنشاء واجهة الـ VPN:", ex);
                          stopVpnConnection();
                      }
                  }).start();
              }

              private void stopVpnConnection() {
                  new Thread(() -> {
                      try {
                          if (vpnInterface != null) {
                              vpnInterface.close();
                              vpnInterface = null;
                          }
                      } catch (Exception e) {
                          Log.e(TAG, "خطأ أثناء إغلاق الواجهة: ", e);
                      }

                      isRunning = false;
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              stopForeground(STOP_FOREGROUND_REMOVE);
                          } else {
                              stopForeground(true);
                          }
                      } catch (Exception ignored) {}
                      stopSelf();
                      Log.d(TAG, "🔒 تم إيقاف خدمة الـ VPN.");
                  }).start();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Apex Shield VPN Protection",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("حالة الاتصال بالشبكة المشفرة");
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              private Notification buildNotification(String serverName) {
                  Intent notificationIntent = new Intent(this, MainActivity.class);
                  PendingIntent pendingIntent = PendingIntent.getActivity(
                          this,
                          0,
                          notificationIntent,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  Notification.Builder builder = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          ? new Notification.Builder(this, CHANNEL_ID)
                          : new Notification.Builder(this);

                  String contentText = (serverName != null && !serverName.isEmpty())
                          ? "متصل بالدرع عبر: " + serverName
                          : "درع الحماية المشفرة نشط الآن";

                  int appIcon = getApplicationInfo().icon != 0 ? getApplicationInfo().icon : android.R.drawable.sym_def_app_icon;

                  return builder
                          .setContentTitle("Apex Shield AI")
                          .setContentText(contentText)
                          .setSmallIcon(appIcon)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build();
              }

              @Override
              public void onDestroy() {
                  stopVpnConnection();
                  super.onDestroy();
              }
          }
          EOF

          # تعديل إعدادات Gradle
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "com.android.billingclient:billing" android/app/build.gradle; then
              sed -i '/dependencies {/a \    implementation "com.android.billingclient:billing:6.1.0"' android/app/build.gradle
            fi

            sed -i -E 's/versionCode [0-9]+/versionCode 35/' android/app/build.gradle
            sed -i -E 's/versionName "[^"]*"/versionName "8.0.0.11"/' android/app/build.gradle
            sed -i 's/minSdk [0-9]+/minSdk 24/g' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]+/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
          fi

          if [ -f "android/variables.gradle" ]; then
            sed -i -E 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i -E 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
            sed -i -E 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          fi

      - name: 3. Build & Sign APK & AAB Packages
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          
          printf "%s" "$RELEASE_KEY" | base64 --decode > signing.keystore
          
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          
          ./gradlew clean assembleRelease bundleRelease --no-daemon

          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found, trying fallback..."
            APKSIGNER="apksigner"
          fi

          $APKSIGNER sign --ks signing.keystore --ks-pass pass:"$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASSWORD" "$APK_FILE"

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_FILE" "$KEY_ALIAS"
          
          rm -f signing.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
