name: Build Android Native APK & AAB (Apex Shield)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1. Setup Web Assets & Dependencies
        run: |
          echo "=== 1. تجهيز مجلد www وتوليد الإعدادات بالنطاق الصحيح ==="
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # كتابة ملف الإعدادات المعتمد بالنطاق الصحيح لتطبيقات الـ VPN
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.apex.shield",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://karamegy.github.io/Vpn/",
              "cleartext": true,
              "allowNavigation": [
                "karamegy.github.io",
                "*.github.io"
              ]
            },
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 2. Initialize Clean Capacitor Android (Preserving Native Java Code)
        run: |
          echo "=== 2. حفظ أكواد الجافا والـ Manifest ثم إعادة توليد البيئة ==="
          mkdir -p /tmp/android_backup
          if [ -d "android/app/src/main/java" ]; then
            cp -r android/app/src/main/java /tmp/android_backup/
          fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/android_backup/
          fi

          rm -rf android
          npx cap add android

          # استعادة أكواد الجافا والجسور والـ Manifest الخاصة بك
          if [ -d "/tmp/android_backup/java" ]; then
            cp -r /tmp/android_backup/java/* android/app/src/main/java/
          fi
          if [ -f "/tmp/android_backup/AndroidManifest.xml" ]; then
            cp /tmp/android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          npx cap sync android

      - name: 3. Build APK & AAB Packages
        run: |
          echo "=== 3. بناء وتصدير حزم APK و AAB ==="
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
