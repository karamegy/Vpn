name: Build Native APK & AAB (Apex Shield ai)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      - name: 1. Setup Web Assets & Dependencies
        run: |
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.Vpn",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 2. Patch Gradle & Sync Existing Android Project
        run: |
          # إضافة مستودع JitPack ومكتبة WireGuard مباشرة على ملفاتك الموجودة
          node -e '
            const fs = require("fs");
            
            const settingsPath = "android/settings.gradle";
            if (fs.existsSync(settingsPath)) {
              let settings = fs.readFileSync(settingsPath, "utf8");
              if (!settings.includes("jitpack.io")) {
                if (settings.includes("dependencyResolutionManagement")) {
                  settings = settings.replace(
                    /(dependencyResolutionManagement\s*\{[^}]*repositories\s*\{)/,
                    "$1\n        maven { url '\''https://jitpack.io'\'' }"
                  );
                } else {
                  settings = settings.replace(
                    /repositories\s*\{/,
                    "repositories {\n        google()\n        mavenCentral()\n        maven { url '\''https://jitpack.io'\'' }"
                  );
                }
                fs.writeFileSync(settingsPath, settings);
              }
            }

            const bgPath = "android/app/build.gradle";
            if (fs.existsSync(bgPath)) {
              let bg = fs.readFileSync(bgPath, "utf8");
              if (!bg.includes("com.wireguard.android:tunnel")) {
                bg = bg.replace(/(dependencies\s*\{)/, "$1\n    implementation \"com.wireguard.android:tunnel:1.0.20230707\"");
              }
              if (!bg.includes("packagingOptions")) {
                bg = bg.replace(/(android\s*\{)/, "$1\n    packagingOptions {\n        resources {\n            excludes += [\"META-INF/INDEX.LIST\", \"META-INF/io.netty.versions.properties\", \"META-INF/DEPENDENCIES\"]\n        }\n    }");
              }
              fs.writeFileSync(bgPath, bg);
            }
          '

          npx cap sync android

      - name: 3. Build Native APK & AAB Packages
        run: |
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace

      - name: 4. Sign APK & AAB Packages
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          if [ -n "$RELEASE_KEY" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Signing binaries with Repository Secrets..."
            printf "%s" "$RELEASE_KEY" | base64 --decode > signing.keystore
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$APK_FILE" "$KEY_ALIAS" || true
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_FILE" "$KEY_ALIAS" || true
            rm -f signing.keystore
          else
            echo "Secrets missing, proceeding with unsigned release binaries."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
