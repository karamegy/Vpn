name: Build Android Native APK & AAB (Apex Shield)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1. Extract Java Files From Any Path
        run: |
          echo "=== 1. تجميع ملفات الجافا وحفظها مؤقتاً ==="
          mkdir -p /tmp/java_source
          find . -name "*.java" -exec cp {} /tmp/java_source/ \;
          ls -la /tmp/java_source/
          rm -rf android

      - name: 2. Prepare Web Assets & Environment
        run: |
          echo "=== 2. تجهيز ملفات الويب وحزم Capacitor ==="
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 3. Generate Clean Android Project
        run: |
          echo "=== 3. إنشاء مشروع أندرويد جديد ونظيف ==="
          npx cap add android

      - name: 4. Inject Java Files & Configure Manifest
        run: |
          echo "=== 4. نقل ملفات الجافا وتحديث AndroidManifest.xml ==="
          TARGET_DIR="android/app/src/main/java/com/apex/shield"
          mkdir -p "$TARGET_DIR"
          cp /tmp/java_source/*.java "$TARGET_DIR/" || true
          ls -la "$TARGET_DIR/"

          cat << 'EOF' > update_manifest.js
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          if (fs.existsSync(file)) {
            let content = fs.readFileSync(file, 'utf8');
            if (!content.includes('ApexVpnService')) {
              const service = `
                  <service android:name="com.apex.shield.ApexVpnService"
                           android:permission="android.permission.BIND_VPN_SERVICE"
                           android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
          </application>`;
              content = content.replace('</application>', service);
              fs.writeFileSync(file, content, 'utf8');
              console.log('Done updating AndroidManifest.xml');
            }
          }
          EOF

          node update_manifest.js
          npx cap sync android

      - name: 5. Build APK & AAB Packages
        run: |
          echo "=== 5. بناء تطبيق الـ APK والـ AAB ==="
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
