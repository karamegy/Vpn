name: Build Android Native APK & AAB (Apex Shield)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1. Extract Java Files & Clean Old Android Dir
        run: |
          echo "=== 1. حفظ ملفات الجافا وتنظيف المجلدات القديمة ==="
          mkdir -p /tmp/java_source
          find . -name "*.java" -exec cp {} /tmp/java_source/ \;
          ls -la /tmp/java_source/
          rm -rf android

      - name: 2. Prepare Web Assets & Capacitor Config
        run: |
          echo "=== 2. تجهيز مجلد www وملف capacitor.config.json ==="
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.apex.shield",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 3. Generate Clean Android Project
        run: |
          echo "=== 3. إنشاء مشروع أندرويد جديد ==="
          npx cap add android

      - name: 4. Sanitize Java Files & Configure Manifest
        run: |
          echo "=== 4. تنظيف ملفات الجافا وتحديث AndroidManifest.xml بأسلوب آمن ==="
          TARGET_DIR="android/app/src/main/java/com/apex/shield"
          mkdir -p "$TARGET_DIR"
          cp /tmp/java_source/*.java "$TARGET_DIR/" || true

          cat << 'EOF' > sanitize_and_update.js
          const fs = require('fs');
          const path = require('path');

          // 1. تنظيف ملفات الجافا وحذف ترميز BOM وتثبيت اسم الحزمة
          const targetDir = 'android/app/src/main/java/com/apex/shield';
          if (fs.existsSync(targetDir)) {
            const files = fs.readdirSync(targetDir);
            files.forEach(file => {
              if (file.endsWith('.java')) {
                const filePath = path.join(targetDir, file);
                let content = fs.readFileSync(filePath, 'utf8');
                
                // إزالة رمز الترميز الخفي BOM
                content = content.replace(/^\uFEFF/, '');
                
                // توحيد اسم الحزمة
                content = content.replace(/^package\s+[a-zA-Z0-9_\.]+;/m, 'package com.apex.shield;');
                
                fs.writeFileSync(filePath, content, 'utf8');
                console.log(`Sanitized: ${file}`);
              }
            });
          }

          // 2. تحديث AndroidManifest.xml بوضع الأذونات القياسية وتثبيت خدمة الـ VPN
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          if (fs.existsSync(manifestPath)) {
            let manifest = fs.readFileSync(manifestPath, 'utf8');

            const permissionsToAdd = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
            ];

            permissionsToAdd.forEach(perm => {
              const permName = perm.match(/name="([^"]+)"/)[1];
              if (!manifest.includes(permName)) {
                manifest = manifest.replace('<application', `    ${perm}\n    <application`);
              }
            });

            const serviceTag = `
        <service
            android:name="com.apex.shield.ApexVpnService"
            android:permission="android.permission.BIND_VPN_SERVICE"
            android:exported="false">
            <intent-filter>
                <action android:name="android.net.VpnService" />
            </intent-filter>
        </service>`;

            if (!manifest.includes('ApexVpnService')) {
              manifest = manifest.replace('</application>', `${serviceTag}\n    </application>`);
            }

            fs.writeFileSync(manifestPath, manifest, 'utf8');
            console.log('Updated AndroidManifest.xml safely.');
          }
          EOF

          node sanitize_and_update.js
          npx cap sync android

      - name: 5. Build APK Package
        run: |
          echo "=== 5. بناء تطبيق الـ APK ==="
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 6. Build AAB Package
        run: |
          echo "=== 6. بناء تطبيق الـ AAB للجوجل بلاي ==="
          cd android
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
