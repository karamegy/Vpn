name: Build Android Native APK & AAB (Apex Shield)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backup Custom Java Files
        run: |
          mkdir -p ../java_backup
          if [ -d "android/app/src/main/java" ]; then
            cp -r android/app/src/main/java/* ../java_backup/ || true
          fi

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Restore Custom Java Files
        run: |
          if [ -d "../java_backup" ]; then
            mkdir -p android/app/src/main/java/
            cp -r ../java_backup/* android/app/src/main/java/ || true
          fi

      - name: Build Both APK and AAB Packages
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload APK (For Direct Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/app-release.aab
