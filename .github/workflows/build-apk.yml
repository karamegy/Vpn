name: Build Android Native APK & AAB (Apex Shield)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Setup Web Assets & Config
        run: |
          echo "=== 1. تجهيز مجلد www وتثبيت النطاق الصحيح ==="
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.Vpn",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://karamegy.github.io/Vpn/",
              "cleartext": true,
              "allowNavigation": [
                "karamegy.github.io",
                "*.github.io"
              ]
            },
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 2. Initialize Clean Capacitor Android Platform & Set SDK 36
        run: |
          echo "=== 2. إعادة إنشاء بيئة أندرويد نظيفة تماماً وضبط SDK 36 ==="
          rm -rf android
          npx cap add android

          if [ -f "android/variables.gradle" ]; then
            sed -i -E 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i -E 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/versionCode [0-9]+/versionCode 23/' android/app/build.gradle
            sed -i -E 's/versionName "[^"]+"/versionName "36"/' android/app/build.gradle
          fi

          # تعديل الحزمة داخل ملفات الجافا والـ Manifest تلقائياً
          find android/app/src/main -type f -name "*.java" -o -name "AndroidManifest.xml" | xargs sed -i 's/com\.apex\.shield/io\.github\.karamegy\.Vpn/g' 2>/dev/null || true

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Apex Shield</string>
              <string name="appName">Apex Shield</string>
              <string name="launcherName">Apex Shield</string>
              <string name="hostName">karamegy.github.io</string>
              <string name="title_activity_main">Apex Shield</string>
              <string name="package_name">io.github.karamegy.Vpn</string>
              <string name="custom_url_scheme">io.github.karamegy.Vpn</string>
          </resources>
          EOF

          npx cap sync android

      - name: 3. Build Release Bundle (AAB) & APK
        run: |
          echo "=== 3. بناء حزم التطبيق بنجاح بدون أخطاء ==="
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          ./gradlew clean assembleDebug bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
