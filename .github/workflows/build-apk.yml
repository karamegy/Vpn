name: Build Android Native APK & AAB (Apex Shield)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Setup Web Assets & Local Config
        run: |
          mkdir -p www
          cp -r index.html app.js style.css manifest.json sw.js *.png *.html .well-known www/ 2>/dev/null || true
          
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.Vpn",
            "appName": "Apex Shield AI",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "webContentsDebuggingEnabled": true,
              "allowMixedContent": true
            }
          }
          EOF

      - name: 2. Preserve Native Java & Sync Capacitor
        run: |
          # الحفاظ على مجلد android الأصلي وملفات الجافا الخاصة بالـ VPN وعدم مسحها
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          cd ..

          if [ -f "android/variables.gradle" ]; then
            sed -i -E 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i -E 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
            sed -i -E 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          fi

          # تحديث رقم الإصدار إلى 28 و 8.0.0.4 ليتوافق مع متجر جوجل بلاي
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/versionCode [0-9]+/versionCode 28/' android/app/build.gradle
            sed -i -E 's/versionName "[^"]*"/versionName "8.0.0.4"/' android/app/build.gradle
            sed -i 's/minSdk [0-9]+/minSdk 24/g' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]+/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
          fi

          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "BIND_VPN_SERVICE" "$MANIFEST_PATH"; then
              sed -i '/<uses-permission android:name="android\.permission\.INTERNET"/a \    <uses-permission android:name="android.permission.BIND_VPN_SERVICE"/>' "$MANIFEST_PATH"
            fi
            if ! grep -q "ApexVpnService" "$MANIFEST_PATH"; then
              sed -i '/<\/application>/i \    <service android:name="io.github.karamegy.Vpn.ApexVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">\n        <intent-filter>\n            <action android:name="android.net.VpnService"/>\n        </intent-filter>\n    </service>' "$MANIFEST_PATH"
            fi
          fi

          npx cap sync android

      - name: 3. Build & Sign APK & AAB Packages
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          
          printf "%s" "$RELEASE_KEY" | base64 --decode > signing.keystore
          
          chmod +x gradlew
          export GRADLE_OPTS="-Dfile.encoding=UTF-8"
          
          # بناء APK التثبيت المباشر وحزمة AAB الخاصة بمتجر جوجل بلاي
          ./gradlew clean assembleDebug bundleRelease --no-daemon

          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          # توقيع حزمة AAB لمطبوعات Google Play
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore signing.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_FILE" "$KEY_ALIAS"
          
          rm -f signing.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-v8.0.0.4-APK-DirectInstall
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ApexShield-v8.0.0.4-AAB-GooglePlay
          path: android/app/build/outputs/bundle/release/*.aab
